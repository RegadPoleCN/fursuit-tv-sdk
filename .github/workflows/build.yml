name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=true"

jobs:
  build:
    # 跳过 dependabot[bot] 的操作以及包含 [ci skip] 或 [skip ci] 的提交
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')))
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build all platforms and run all checks
      run: ./gradlew build checkAll --stacktrace

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: fursuit-tv-sdk
        path: |
          build/libs/

    - name: Upload test and lint reports on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: failure-reports
        path: |
          build/reports/tests/
          build/reports/detekt/
          build/reports/ktlint/
