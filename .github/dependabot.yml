version: 2
updates:
  # Gradle dependencies (weekly check)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "RegadPoleCN"
    groups:
      kotlin-dependencies:
        patterns:
          - "kotlin*"
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:*"
        update-types:
          - "minor"
          - "patch"

      ktor-dependencies:
        patterns:
          - "io.ktor:*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 不自动提 alpha/beta/rc 等预发布版本的升级 PR
      - dependency-name: "*"
        update-types:
          - "version-update:semver-prerelease"

  # npm 依赖（examples/js，随 SDK 发版自动跟进，monthly check）
  - package-ecosystem: "npm"
    directory: "/examples/js"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "RegadPoleCN"

  # GitHub Actions (monthly check)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - "RegadPoleCN"
